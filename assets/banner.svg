<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1424"/>
      <stop offset="0.55" stop-color="#10233F"/>
      <stop offset="1" stop-color="#0B1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD6C4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3DD6C4"/>
      <stop offset="1" stop-color="#6D8CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="900" y1="260" x2="1240" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD6C4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3DD6C4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="150" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD6C4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3DD6C4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 190) rotate(90) scale(220 320)">
      <stop stop-color="#3DD6C4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3DD6C4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7FA3D6" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <circle cx="1120" cy="80" r="120" fill="#6D8CFF" fill-opacity="0.10"/>
  <circle cx="1180" cy="250" r="90" fill="#3DD6C4" fill-opacity="0.08"/>

  <!-- 书堆 -->
  <g transform="translate(80 120)">
    <ellipse cx="100" cy="132" rx="96" ry="12" fill="#000000" fill-opacity="0.25"/>
    <rect x="30" y="96" width="140" height="28" rx="7" fill="#6D8CFF"/>
    <rect x="30" y="96" width="10" height="28" rx="5" fill="#8FA6FF"/>
    <rect x="52" y="104" width="86" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="52" y="113" width="62" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="18" y="64" width="164" height="28" rx="7" fill="#3DD6C4"/>
    <rect x="18" y="64" width="10" height="28" rx="5" fill="#7BE8D9"/>
    <rect x="40" y="72" width="96" height="4" rx="2" fill="#062A2A" fill-opacity="0.55"/>
    <rect x="40" y="81" width="70" height="4" rx="2" fill="#062A2A" fill-opacity="0.28"/>
    <rect x="38" y="32" width="124" height="28" rx="7" fill="#F5B85C"/>
    <rect x="38" y="32" width="10" height="28" rx="5" fill="#FFD08A"/>
    <rect x="60" y="40" width="74" height="4" rx="2" fill="#3A2405" fill-opacity="0.55"/>
    <rect x="60" y="49" width="50" height="4" rx="2" fill="#3A2405" fill-opacity="0.28"/>
    <path d="M132 32 h10 v22 l-5 -5 l-5 5 z" fill="#0A1424" fill-opacity="0.55"/>
  </g>

  <!-- 标题 -->
  <text x="330" y="148" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="54" font-weight="800" fill="#EAF2FF">BookCollector <tspan fill="#3DD6C4">Admin</tspan></text>
  <text x="332" y="192" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#9FB3D1">图书采集 · 数据治理 · 可视化后台</text>

  <!-- 技术标签 -->
  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#CFE0FF">
    <rect x="330" y="222" width="152" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="406" y="242" text-anchor="middle">Spring Boot 2.3</text>
    <rect x="494" y="222" width="72" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="530" y="242" text-anchor="middle">Vue 3</text>
    <rect x="578" y="222" width="94" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="625" y="242" text-anchor="middle">MongoDB</text>
    <rect x="684" y="222" width="76" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="722" y="242" text-anchor="middle">Redis</text>
  </g>

  <!-- 折线 -->
  <g>
    <path d="M900 250 L960 228 L1020 238 L1080 196 L1140 206 L1200 160 L1240 168 L1240 280 L900 280 Z" fill="url(#area)"/>
    <polyline points="900,250 960,228 1020,238 1080,196 1140,206 1200,160 1240,168" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#3DD6C4">
      <circle cx="900" cy="250" r="4"/>
      <circle cx="960" cy="228" r="4"/>
      <circle cx="1020" cy="238" r="4"/>
      <circle cx="1080" cy="196" r="4"/>
      <circle cx="1140" cy="206" r="4"/>
      <circle cx="1200" cy="160" r="4"/>
      <circle cx="1240" cy="168" r="4"/>
    </g>
    <circle cx="1200" cy="160" r="10" fill="#3DD6C4" fill-opacity="0.18"/>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
